<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Kontak</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="welcome-speech">Selamat Datang!</h1>
    <button onclick="greetUser()">Sapa Saya</button>

    <hr>

    <h2>Hubungi Kami</h2>
    <form id="contact-form">
        <input type="text" id="name-input" placeholder="Nama Anda"><br>
        <input type="email" id="email-input" placeholder="Email Anda"><br>
        <textarea id="message-input" placeholder="Pesan Anda"></textarea><br>
        <button type="button" onclick="validateForm()">Kirim</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
